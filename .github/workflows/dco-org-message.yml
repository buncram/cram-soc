name: Post DCO Org Notice

on:
  pull_request:
    types: [opened]

jobs:
  post-dco-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post DCO message
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = `
This project enforces the [Developer Certificate of Origin (DCO)](https://developercertificate.org/).

By signing off your commits, you acknowledge this DCO on behalf of ACME Corp contributors.
`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const alreadyCommented = comments.some(comment =>
              comment.body.includes('Developer Certificate of Origin (DCO)')
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            } else {
              console.log("DCO message already posted.");
